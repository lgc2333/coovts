name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  COVERAGE_PYTHON_VERSION: '3.14'

jobs:
  check:
    name: Lint & type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: 'pyproject.toml'

      - name: Lint
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Check the generated stub
        run: uv run --locked python scripts/generate_plugin_api.py --check

      - name: Type check
        run: uv run --locked basedpyright

  test:
    name: Test

    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        os: [ubuntu-latest] # [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pytest with coverage
        if: matrix.python-version == env.COVERAGE_PYTHON_VERSION
        shell: bash
        run: >-
          uv run --locked pytest
          --cov=coovts
          --cov-branch
          --cov-report=xml:coverage.xml
          --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

      - name: Run Pytest
        if: matrix.python-version != env.COVERAGE_PYTHON_VERSION
        run: uv run --locked pytest

      - name: Upload coverage to Codecov
        if: >-
          !cancelled() &&
          matrix.python-version == env.COVERAGE_PYTHON_VERSION
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          files: coverage.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
