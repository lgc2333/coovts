[project]
name = "coovts"
dynamic = ["version"]
description = "Another type rich library for making VTube Studio plugins with Python"
authors = [{ name = "LgCuwukii", email = "lgc2333@126.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["vtube studio", "vtuber", "live2d", "websocket", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "cookit[pydantic]>=0.14.1",
    "pydantic>=2.13.5",
    "websockets>=17.1",
]

[project.optional-dependencies]
log = ["cookit[loguru]>=0.14.1", "loguru>=0.7.3"]
all = ["coovts[log]"]

[project.urls]
Homepage = "https://github.com/lgc2333/coovts"
Repository = "https://github.com/lgc2333/coovts"
Issues = "https://github.com/lgc2333/coovts/issues"

[dependency-groups]
dev = [
    # the `log` extra has to be installed for the type check to see the optional loguru import
    "coovts[log]",
    "basedpyright>=1.40.1",
    "hatchling>=1.32.3",
    "ruff>=0.16.8",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "coovts/__init__.py"

[tool.poe.tasks]
lint.cmd = "ruff check"
lint-fix.cmd = "ruff check --fix --unsafe-fixes"
check.cmd = "basedpyright"
format.cmd = "ruff format"
test.cmd = "pytest"
coverage.cmd = "uv run pytest --cov=coovts --cov-branch --cov-report=term-missing"

gen-api.cmd = "uv run python scripts/generate_plugin_api.py"
gen-api-check.cmd = "uv run python scripts/generate_plugin_api.py --check"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
exclude = ["**/node_modules", "**/.venv", "temp"]

[tool.ruff]
target-version = "py312"
respect-gitignore = false
extend-exclude = ["temp"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
ignore = [
    "B008",
    # mutable defaults are what pydantic list fields look like, and ruff only recognises a base
    # class literally named `BaseModel`, not `VTSBaseModel`
    "RUF012",
    "B905",
    "COM812",
    "E501",
    "F821",
    "FBT001",
    "FBT002",
    "ISC001",
    "PERF203",
    "PGH003",
    "PLC04",
    "PLC2701",
    "PLR09",
    "PLR1702",
    "PLR2004",
    "PLR6301",
    "PLW0603",
    "PLW1641",
    "PLW2901",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF006",
    "RUF029",
    "RUF100",
    "S101",
    "S311",
    "S404",
    "SIM117",
    "TC001",
    "TRY002",
    "TRY003",
    "W505",
]
select = [
    "A",
    "ANN001",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "COM",
    "DTZ",
    "E",
    "F",
    "FAST",
    "FBT",
    "FLY",
    "FURB",
    "I",
    "INP",
    "ISC",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "TC",
    "TRY",
    "UP",
    "W",
    "YTT",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*" = ["INP001"]
"**/tests*/**" = [
    # "INP001", # no __init__.py
    "ARG001", # arg not used
]

[tool.ruff.lint.isort]
combine-as-imports = true
detect-same-package = true
extra-standard-library = ["typing_extensions"]
split-on-trailing-comma = true

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
exempt-modules = [
    "types",
    "typing",
    "typing_extensions",
    "collections",
    "pathlib",
]

[tool.pytest.ini_options]
addopts = ["--ignore=private/references", "--ignore=temp"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
