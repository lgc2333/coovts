[project]
name = "coovts"
dynamic = ["version"]
description = "Another type rich library for making VTube Studio plugins with Python"
authors = [{ name = "LgCookie", email = "lgc2333@126.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "cookit[loguru,pydantic]>=0.11.6",
    "pydantic>=2.11.4",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = ["basedpyright>=1.29.1", "hatchling>=1.27.0", "ruff>=0.11.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "coovts/__init__.py"

[tool.poe.tasks]
lint.cmd = "ruff check"
lint-fix.cmd = "ruff check --fix --unsafe-fixes"
check.cmd = "basedpyright"
format.cmd = "ruff format"
test.cmd = "pytest"
gen-api.cmd = "uv run python scripts/generate_plugin_api.py"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
exclude = ["**/node_modules", "**/.venv", "temp"]

[tool.ruff]
target-version = "py312"
respect-gitignore = false
extend-exclude = ["temp"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
ignore = [
    "B008",
    "B905",
    "COM812",
    "E501",
    "F821",
    "FBT001",
    "FBT002",
    "ISC001",
    "PERF203",
    "PGH003",
    "PLC04",
    "PLC2701",
    "PLR09",
    "PLR1702",
    "PLR2004",
    "PLR6301",
    "PLW0603",
    "PLW1641",
    "PLW2901",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF006",
    "RUF029",
    "RUF100",
    "S101",
    "S311",
    "S404",
    "SIM117",
    "TC001",
    "TRY002",
    "TRY003",
    "W505",
]
select = [
    "A",
    "ANN001",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "COM",
    "DTZ",
    "E",
    "F",
    "FAST",
    "FBT",
    "FLY",
    "FURB",
    "I",
    "INP",
    "ISC",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "TC",
    "TRY",
    "UP",
    "W",
    "YTT",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*" = ["INP001"]
"**/tests*/**" = [
    # "INP001", # no __init__.py
    "ARG001", # arg not used
]

[tool.ruff.lint.isort]
combine-as-imports = true
detect-same-package = true
extra-standard-library = ["typing_extensions"]
split-on-trailing-comma = true

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
exempt-modules = [
    "types",
    "typing",
    "typing_extensions",
    "collections",
    "pathlib",
]

[tool.pytest.ini_options]
addopts = ["--ignore=private/references", "--ignore=temp"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
